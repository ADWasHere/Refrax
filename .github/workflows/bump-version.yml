name: Module - Version Bump

on:
  workflow_call:
    inputs:
      bump_type:
        required: true
        type: string
    outputs:
      release_version:
        description: "The generated release version"
        value: ${{ jobs.bump.outputs.release_version }}
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.get-ver.outputs.release_version }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'core-platform/pom.xml'

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Strip -SNAPSHOT & Tag Release
        id: get-ver
        working-directory: core-platform
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          
          echo "Setting Release Version: $RELEASE_VERSION"
          mvn versions:set -DnewVersion=$RELEASE_VERSION -DgenerateBackupPoms=false
          
          git add pom.xml
          git commit -m "chore(release): prepare release $RELEASE_VERSION [skip ci]"
          git tag -a "v$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Increment Next Development SNAPSHOT Version & Push
        working-directory: core-platform
        run: |
          BUMP_TYPE="${{ inputs.bump_type }}"
          
          if [ "$BUMP_TYPE" = "major" ]; then
            NEW_VER_EXPR='${parsedVersion.nextMajorVersion}.0.0-SNAPSHOT'
          elif [ "$BUMP_TYPE" = "patch" ]; then
            NEW_VER_EXPR='${parsedVersion.majorVersion}.${parsedVersion.minorVersion}.${parsedVersion.nextIncrementalVersion}-SNAPSHOT'
          else
            NEW_VER_EXPR='${parsedVersion.majorVersion}.${parsedVersion.nextMinorVersion}.0-SNAPSHOT'
          fi

          mvn build-helper:parse-version versions:set \
            -DnewVersion=$NEW_VER_EXPR \
            -DgenerateBackupPoms=false

          NEXT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Setting Next SNAPSHOT Version: $NEXT_VERSION"

          git add pom.xml
          git commit -m "chore: prepare for next iteration $NEXT_VERSION [skip ci]"
          
          RELEASE_TAG=$(git describe --tags --abbrev=0)
          git push origin HEAD "$RELEASE_TAG"
