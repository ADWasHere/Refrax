name: Module - Docker Publish

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
        description: "Release version to be used for the Docker image tag."
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: "v${{ inputs.release_version }}"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'core-platform/pom.xml'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Native Binary, Docker Image & Push
        working-directory: core-platform
        run: |
          mvn clean package -Dnative \
            -Dquarkus.native.container-build=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.tag=${{ inputs.release_version }} \
            -Dquarkus.container-image.additional-tags=latest \
            -Dquarkus.analytics.disabled=true