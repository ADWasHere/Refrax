name: Main Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Select release bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - patch
          - major

permissions:
  contents: write

jobs:
  call-build:
    uses: ./.github/workflows/build.yml

  call-bump:
    needs: call-build
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bump-version.yml
    with:
      bump_type: ${{ github.event.inputs.bump_type }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  call-create-support-branch:
    needs: call-bump
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.bump_type == 'minor' || github.event.inputs.bump_type == 'major')
    uses: ./.github/workflows/create-support-branch.yml
    with:
      release_version: ${{ needs.call-bump.outputs.release_version }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}