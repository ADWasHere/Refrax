quarkus.datasource.devservices.enabled=true

# The Flyway migration creates a Timescale hypertable, so tests run on a TimescaleDB image
# (not plain Postgres) — otherwise create_hypertable() would not exist.
quarkus.datasource.devservices.image-name=timescale/timescaledb:latest-pg17

# Tests exercise the header-based tenant flow without authentication.
refrax.tenant.resolver=header

# The read-model consumer is triggered deterministically from tests, not on a timer.
quarkus.scheduler.enabled=false

refrax.schema.locations=schemas/air-quality-reading.json
refrax.view.locations=views/air-quality-full.json,views/air-quality-value-only.json
