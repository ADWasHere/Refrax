quarkus.container-image.group=refrax
quarkus.container-image.name=core-platform
quarkus.container-image.build=true
quarkus.native.container-build=true

quarkus.http.port=${HTTP_PORT:8787}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:refrax}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:refrax}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.hibernate-orm.database.generation=validate

# Comma-separated classpath resources; add a file here to declare another event type.
#refrax.schema.locations=schemas/air-quality-reading.json

refrax.tenant.resolver=token-claim
# Path in the verified token attributes to read tenant from (dot-separated)
refrax.tenant.claim-path=org_id

# Comma-separated classpath resources; add a file here to declare another view.
#refrax.view.locations=views/air-quality-full.json,views/air-quality-value-only.json