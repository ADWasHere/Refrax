quarkus.container-image.group=adwashere
quarkus.container-image.name=refrax-core-platform
quarkus.container-image.build=true
quarkus.native.container-build=true

quarkus.http.port=${HTTP_PORT:8787}

quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:refrax}
%prod.quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:refrax}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:refrax}
%dev.quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:refrax}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.hibernate-orm.schema-generation.database.generation=validate

# Comma-separated classpath resources; add a file here to declare another event type.
refrax.schema.locations=schemas/air-quality-reading.json

# Comma-separated classpath resources; add a file here to declare another view.
refrax.view.locations=views/air-quality-full.json,views/air-quality-value-only.json

# Options: token-claim, header via X-Tenant-ID
refrax.tenant.resolver=header
# Path in the verified token attributes to read tenant from (dot-separated)
refrax.tenant.claim-path=org_id

# Comma-separated tenant identities allowed to provision new tenants via POST /v1/tenants.
# Refrax does not authenticate callers itself; this only gates a privileged endpoint against
# whoever can set an X-Tenant-ID or hold a token, it is not a substitute for real auth in
# front of Refrax.
refrax.tenant.admin-ids=admin

